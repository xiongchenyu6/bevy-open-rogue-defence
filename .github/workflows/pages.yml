name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build WASM site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: pages-wasm

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Verify game artwork
        run: |
          python3 tools/verify_campaign_data.py
          python3 tools/verify_models.py
          python3 tools/verify_ui_assets.py
          python3 -m unittest discover -s tools -p test_generate_web_manifest.py
          python3 -m unittest discover -s tools -p test_retain_web_releases.py
          python3 -m unittest discover -s tools -p test_web_engine_reuse.py
          node --check web/downloads.js
          node --check web/sw.js
          node --check web/game-cache.js

      - name: Build web distribution
        env:
          WASM_REUSE_BASE_URL: https://xiongchenyu6.github.io/bevy-open-rogue-defence/
        run: bash scripts/build-wasm.sh

      - name: Retain immutable resources for supported releases
        run: python3 tools/retain_web_releases.py dist --base-url https://xiongchenyu6.github.io/bevy-open-rogue-defence/ | tee update-size-report.json

      - name: Upload update size audit
        uses: actions/upload-artifact@v4
        with:
          name: update-size-report
          path: update-size-report.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
