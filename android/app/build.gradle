plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.roguecommander.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.roguecommander.game'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        prefab true
    }

    sourceSets {
        main {
            // Bevy resolves runtime assets relative to this Android asset root.
            assets.srcDirs += files('../../assets')
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    // Keep this compatible with Bevy 0.19's android-activity dependency.
    implementation libs.games.activity
}
