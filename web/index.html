<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#07111c" />
    <meta
      name="description"
      content="Rogue Commander — an original mobile-first survival defense game built with Bevy."
    />
    <title>Rogue Commander</title>
    <link rel="icon" href="data:," />
    <link
      rel="preload"
      href="./assets/fonts/rogue_commander_ui.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Rogue Commander Sans";
        src: url("./assets/fonts/rogue_commander_ui.ttf") format("truetype");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        font-family: "Rogue Commander Sans", Inter, system-ui, sans-serif;
        background: #07111c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background:
          radial-gradient(circle at 80% 50%, #9a2d2638, transparent 30%),
          radial-gradient(circle at 20% 50%, #2678912e, transparent 32%),
          #07111c;
      }

      #bevy-canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        outline: none;
        touch-action: none;
      }

      #loading,
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        background:
          linear-gradient(90deg, #07111cf2, #101b29e8),
          repeating-linear-gradient(0deg, #ffffff06 0 1px, transparent 1px 42px);
        text-align: center;
        transition: opacity 300ms ease;
      }

      #loading.hidden {
        pointer-events: none;
        opacity: 0;
      }

      .language-switch {
        position: fixed;
        top: max(0.75rem, env(safe-area-inset-top));
        right: max(0.75rem, env(safe-area-inset-right));
        z-index: 30;
        display: flex;
        gap: 2px;
        padding: 3px;
        border: 1px solid #8db8c666;
        border-radius: 999px;
        background: #07111cdd;
        box-shadow: 0 6px 24px #0008;
        transition: opacity 200ms ease;
      }

      .language-switch.hidden {
        pointer-events: none;
        opacity: 0;
      }

      .language-switch button {
        min-width: 54px;
        min-height: 48px;
        padding: 0 0.8rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #9eb5bf;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        touch-action: manipulation;
      }

      .language-switch button[aria-pressed="true"] {
        background: #285262;
        color: #fff4d6;
      }

      .language-switch button:focus-visible,
      #start:focus-visible {
        outline: 2px solid #ffcf70;
        outline-offset: 2px;
      }

      .panel {
        width: min(620px, 90vw);
      }

      .sigil {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.25rem;
        transform: rotate(45deg);
        border: 2px solid #ffcf70;
        background: linear-gradient(135deg, #e65d37 0 48%, #2cb0c0 52% 100%);
        box-shadow: 0 0 36px #e7773e55;
      }

      h1 {
        margin: 0;
        color: #f5e4bc;
        font-size: clamp(2rem, 6vw, 4.5rem);
        letter-spacing: 0.09em;
        text-shadow: 0 3px 24px #000;
      }

      .subtitle {
        margin: 0.5rem 0 1.5rem;
        color: #8db8c6;
        font-size: clamp(0.75rem, 1.5vw, 1rem);
        letter-spacing: 0.22em;
      }

      #status {
        min-height: 1.5em;
        color: #c6d3d8;
      }

      #start {
        min-width: 190px;
        min-height: 52px;
        margin-top: 0.5rem;
        border: 1px solid #ffd88c;
        border-radius: 4px;
        background: linear-gradient(180deg, #a64731, #69291f);
        color: #fff4d6;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.16em;
        cursor: pointer;
        box-shadow: 0 8px 30px #0008;
      }

      #start:disabled {
        cursor: wait;
        filter: saturate(0.4);
      }

      .progress {
        width: min(360px, 72vw);
        height: 5px;
        margin: 1rem auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: #ffffff18;
      }

      #progress-fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2cb0c0, #ffcf70, #e65d37);
        transition: width 180ms ease;
      }

      .hint {
        margin-top: 1rem;
        color: #718793;
        font-size: 0.78rem;
      }

      #rotate {
        z-index: 20;
        display: none;
      }

      #rotate strong {
        display: block;
        margin-bottom: 0.5rem;
        color: #f5e4bc;
        font-size: 1.5rem;
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bevy-canvas" tabindex="0"></canvas>
    <nav id="language-switch" class="language-switch" aria-label="Language">
      <button type="button" data-language="en" aria-label="English" aria-pressed="true">
        EN
      </button>
      <button
        type="button"
        data-language="zh-CN"
        aria-label="简体中文"
        aria-pressed="false"
      >
        简中
      </button>
    </nav>
    <main id="loading">
      <div class="panel">
        <div class="sigil" aria-hidden="true"></div>
        <h1>ROGUE COMMANDER</h1>
        <p id="subtitle" class="subtitle">
          HOLD THE RIFT · BUILD YOUR ARMY · DEFEAT FIVE LORDS
        </p>
        <p id="status">Tap to load the game. The first launch may take a moment.</p>
        <button id="start" type="button">START GAME</button>
        <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>
        <p id="hint" class="hint">
          Chrome or Edge recommended · Rotate phones to landscape.
        </p>
      </div>
    </main>
    <aside id="rotate">
      <p>
        <strong id="rotate-title">ROTATE YOUR DEVICE</strong>
        <span id="rotate-copy">Rogue Commander uses a 16:9 landscape battlefield.</span>
      </p>
    </aside>
    <script type="module">
      const loading = document.querySelector("#loading");
      const progress = document.querySelector("#progress-fill");
      const start = document.querySelector("#start");
      const status = document.querySelector("#status");
      const subtitle = document.querySelector("#subtitle");
      const hint = document.querySelector("#hint");
      const rotateTitle = document.querySelector("#rotate-title");
      const rotateCopy = document.querySelector("#rotate-copy");
      const languageSwitch = document.querySelector("#language-switch");
      const languageButtons = [...document.querySelectorAll("[data-language]")];
      const description = document.querySelector('meta[name="description"]');
      const LANGUAGE_STORAGE_KEY = "rogue-commander-language";
      const translations = {
        en: {
          description:
            "Rogue Commander — an original mobile-first survival defense game built with Bevy.",
          languageLabel: "Language",
          subtitle: "HOLD THE RIFT · BUILD YOUR ARMY · DEFEAT FIVE LORDS",
          idle: "Tap to load the game. The first launch may take a moment.",
          start: "START GAME",
          hint: "Chrome or Edge recommended · Rotate phones to landscape.",
          rotateTitle: "ROTATE YOUR DEVICE",
          rotateCopy: "Rogue Commander uses a 16:9 landscape battlefield.",
          loading: "LOADING",
          deploying: "Deploying heroes, enemies, and battlefield resources…",
          downloadKnown: (received, total) =>
            `Downloading battlefield ${received} / ${total} MB`,
          downloadUnknown: (received) => `Downloading battlefield ${received} MB`,
          initializing: "Initializing Bevy…",
          ready: "DEFENSE ESTABLISHED",
          loadError: "Loading failed. Update your browser and try again.",
          retry: "RETRY",
        },
        "zh-CN": {
          description:
            "Rogue Commander——一款使用 Bevy 制作、移动端优先的原创俯视角生存塔防。",
          languageLabel: "语言",
          subtitle: "守住裂隙 · 构筑军势 · 击破五王",
          idle: "点击后加载游戏，首次启动需要一点时间。",
          start: "开始游戏",
          hint: "推荐使用 Chrome／Edge；手机请横向游玩。",
          rotateTitle: "请旋转设备",
          rotateCopy: "Rogue Commander 使用 16:9 横向战场。",
          loading: "加载中",
          deploying: "正在部署英雄、敌军与战场资源…",
          downloadKnown: (received, total) =>
            `正在下载战场 ${received} / ${total} MB`,
          downloadUnknown: (received) => `正在下载战场 ${received} MB`,
          initializing: "正在初始化 Bevy…",
          ready: "防线已建立",
          loadError: "加载失败，请更新浏览器后重试。",
          retry: "重新加载",
        },
      };
      let currentLanguage = "en";
      let wakeLock;

      function normalizeLanguage(value) {
        const normalized = value?.trim().toLowerCase().replaceAll("_", "-");
        if (!normalized) return null;
        if (normalized === "en" || normalized.startsWith("en-")) return "en";
        if (normalized === "cn" || normalized.startsWith("zh")) return "zh-CN";
        return null;
      }

      function resolveInitialLanguage() {
        try {
          const fromUrl = normalizeLanguage(
            new URL(window.location.href).searchParams.get("lang"),
          );
          if (fromUrl) return fromUrl;
        } catch (_) {
          // Continue through the remaining language signals.
        }

        try {
          const stored = normalizeLanguage(localStorage.getItem(LANGUAGE_STORAGE_KEY));
          if (stored) return stored;
        } catch (_) {
          // Storage may be unavailable in private or embedded contexts.
        }

        const browserLanguages = navigator.languages?.length
          ? navigator.languages
          : [navigator.language];
        for (const language of browserLanguages) {
          const supported = normalizeLanguage(language);
          if (supported) return supported;
        }
        return "en";
      }

      function copy(key, ...args) {
        const value = translations[currentLanguage][key];
        return typeof value === "function" ? value(...args) : value;
      }

      function setLanguage(value, { persist = false, updateUrl = true } = {}) {
        currentLanguage = normalizeLanguage(value) ?? "en";
        document.documentElement.lang = currentLanguage === "zh-CN" ? "zh-Hans" : "en";
        description.content = copy("description");
        languageSwitch.setAttribute("aria-label", copy("languageLabel"));
        subtitle.textContent = copy("subtitle");
        if (!start.disabled) status.textContent = copy("idle");
        start.textContent = copy("start");
        hint.textContent = copy("hint");
        rotateTitle.textContent = copy("rotateTitle");
        rotateCopy.textContent = copy("rotateCopy");
        for (const button of languageButtons) {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.language === currentLanguage),
          );
        }

        if (persist) {
          try {
            localStorage.setItem(LANGUAGE_STORAGE_KEY, currentLanguage);
          } catch (_) {
            // The URL remains the durable fallback when storage is unavailable.
          }
        }
        if (updateUrl) {
          try {
            const url = new URL(window.location.href);
            url.searchParams.set("lang", currentLanguage);
            history.replaceState(history.state, "", url);
          } catch (_) {
            // Language still applies to the current document.
          }
        }
      }

      // Called by the running game settings; preserve the current run and canvas.
      window.rogueCommanderLanguage = (value) => setLanguage(value);

      function normalizeRunSeed(value) {
        const raw = value?.trim() ?? "";
        if (!/^(?:0[xX][0-9a-fA-F]+|[0-9]+)$/.test(raw)) return null;
        try {
          const parsed = BigInt(raw);
          if (parsed < 0n || parsed > 0xffffffffffffffffn) return null;
          return `0x${parsed.toString(16).padStart(16, "0")}`;
        } catch {
          return null;
        }
      }

      function ensureRunSeedInUrl() {
        try {
          const url = new URL(window.location.href);
          const supplied = normalizeRunSeed(url.searchParams.get("seed"));
          if (supplied) {
            url.searchParams.set("seed", supplied);
            history.replaceState(history.state, "", url);
            return;
          }

          let seed;
          if (globalThis.crypto?.getRandomValues) {
            const words = new Uint32Array(2);
            do {
              globalThis.crypto.getRandomValues(words);
            } while (words[0] === 0 && words[1] === 0);
            seed = `0x${words[0].toString(16).padStart(8, "0")}${words[1]
              .toString(16)
              .padStart(8, "0")}`;
          } else {
            const fallback =
              (BigInt(Date.now()) << 20n) ^
              BigInt(Math.floor(Math.random() * 0x100000000));
            seed = `0x${BigInt.asUintN(64, fallback)
              .toString(16)
              .padStart(16, "0")}`;
          }
          url.searchParams.set("seed", seed);
          history.replaceState(history.state, "", url);
        } catch (error) {
          console.warn("Run seed URL setup failed; using engine entropy.", error);
        }
      }

      setLanguage(resolveInitialLanguage());
      ensureRunSeedInUrl();

      for (const button of languageButtons) {
        button.addEventListener("click", () => {
          setLanguage(button.dataset.language, { persist: true });
        });
      }

      async function enterMobilePlayMode() {
        if (!window.matchMedia("(pointer: coarse)").matches) return;
        try {
          await document.documentElement.requestFullscreen?.();
        } catch (_) {
          // Fullscreen is best-effort on iOS and embedded browsers.
        }
        try {
          await screen.orientation?.lock?.("landscape");
        } catch (_) {
          // Orientation locking is not available in every mobile browser.
        }
      }

      async function keepScreenAwake() {
        if (wakeLock && !wakeLock.released) return;
        try {
          const sentinel = await navigator.wakeLock?.request?.("screen");
          wakeLock = sentinel;
          sentinel?.addEventListener?.("release", () => {
            if (wakeLock === sentinel) wakeLock = undefined;
          });
        } catch (_) {
          wakeLock = undefined;
        }
      }

      async function downloadCompressedWasm() {
        if (typeof DecompressionStream !== "function") return undefined;

        const response = await fetch("./rogue_commander_bg.wasm.gz");
        if (!response.ok || !response.body) return undefined;

        const total = Number(response.headers.get("content-length") || 0);
        let received = 0;
        const meter = new TransformStream({
          transform(chunk, controller) {
            received += chunk.byteLength;
            if (total) {
              const percent = Math.min(92, 8 + (received / total) * 84);
              progress.style.width = `${percent}%`;
              status.textContent = copy(
                "downloadKnown",
                (received / 1048576).toFixed(1),
                (total / 1048576).toFixed(1),
              );
            } else {
              status.textContent = copy(
                "downloadUnknown",
                (received / 1048576).toFixed(1),
              );
            }
            controller.enqueue(chunk);
          },
        });
        const decompressed = response.body
          .pipeThrough(meter)
          .pipeThrough(new DecompressionStream("gzip"));
        return new Response(decompressed).arrayBuffer();
      }

      start.addEventListener("click", async () => {
        start.disabled = true;
        for (const button of languageButtons) button.disabled = true;
        start.textContent = copy("loading");
        status.textContent = copy("deploying");
        progress.style.width = "8%";
        await enterMobilePlayMode();

        try {
          const { default: init } = await import("./rogue_commander.js");
          const wasm = await downloadCompressedWasm();
          status.textContent = copy("initializing");
          progress.style.width = "96%";
          await init(wasm ? { module_or_path: wasm } : undefined);
          status.textContent = copy("ready");
          progress.style.width = "100%";
          document.querySelector("#bevy-canvas")?.focus();
          void keepScreenAwake();
          window.setTimeout(() => {
            loading.classList.add("hidden");
            languageSwitch.classList.add("hidden");
          }, 250);
        } catch (error) {
          console.error(error);
          const message = String(error);
          if (message.includes("Using exceptions for control flow")) {
            loading.classList.add("hidden");
            languageSwitch.classList.add("hidden");
          } else {
            status.textContent = copy("loadError");
            progress.style.width = "0";
            start.disabled = false;
            start.textContent = copy("retry");
            for (const button of languageButtons) button.disabled = false;
          }
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (
          document.visibilityState === "visible" &&
          (!wakeLock || wakeLock.released)
        ) {
          void keepScreenAwake();
        }
      });
    </script>
  </body>
</html>
