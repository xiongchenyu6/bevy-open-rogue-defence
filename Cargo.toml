[package]
name = "rogue_commander"
version = "0.1.0"
edition = "2024"

[lib]
name = "rogue_commander"
crate-type = ["lib", "cdylib"]

[dependencies]
bevy = { version = "=0.19.0", features = ["android-game-activity", "wav"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.103"
web-sys = { version = "=0.3.103", features = ["Location", "Window"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
